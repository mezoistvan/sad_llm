steering:
  # Per-emotion layer choice. The v2 sweep over L10..L27 showed happy and sad
  # have distinct productive layers (happy saturates clean at L19; sad peaks
  # clean at L17, is dead by L21+). See NOTES.md §8 for the eyeball evidence.
  # Coefficients are still in fraction-of-residual-norm units at each vector's
  # own layer, so cross-emotion comparability is preserved.
  coefficient_units: fraction_of_residual_norm
  layer_norms:
    10: 18.425074047512478
    11: 18.735585000779892
    12: 19.755317052205402
    13: 20.33365927802192
    14: 21.002517806159126
    15: 22.123441484239365
    16: 23.53351804945204
    17: 24.802068922254776
    18: 26.15813530815972
    19: 27.610349231296116
    20: 28.950853135850693
    21: 31.146695878770615
    22: 33.14718140496148
    23: 35.348503536648224
    24: 37.32083151075575
    25: 39.58577919006348
    26: 42.60457526312934
    27: 45.551870346069336
  # Each emotion specifies a list of (layer, max) entries. The coefficients for
  # every entry are driven by the same niceness scalar at run time (one-sided
  # activation still holds: happy entries are only non-zero for niceness > 0,
  # sad entries only for niceness < 0), but each layer has its own calibrated
  # max. A single-entry list reproduces the original one-layer-per-emotion
  # setup. Pair sub-sweep + 2-layer calibration can grow the list to 2 entries.
  happy:
    layers:
      - { layer: 19, max: 0.5 }
  sad:
    layers:
      - { layer: 17, max: 0.5 }
location:
  lat: 47.4979
  lon: 19.0402
  timezone: auto
