# Seasonal Affective Disorder LLM — configuration.
# Filled in progressively as the pipeline runs. Sections marked TBD are written
# by `steering/norm.py`, `02_layer_sweep.py`, and `03_calibrate_coefficients.py`.

model:
  name: meta-llama/Llama-3.1-8B-Instruct
  dtype: bfloat16
  cache_dir: /workspace/models

paths:
  vectors_dir: /workspace/vectors
  outputs_dir: /workspace/outputs
  logs_dir: /workspace/logs

generation:
  max_new_tokens: 100
  temperature: 0.7
  top_p: 0.9
  seed: 42

# Two emotion vectors, each computed against a neutral baseline (paper-style).
# Vectors are stored as files under paths.vectors_dir as e.g. happy_L21.pt.
steering:
  # Filled by 02_layer_sweep.py once the productive layer is identified.
  # Prior: layer ~21 (about two-thirds of the way through 32 layers, per
  # Sofroniew et al. 2026).
  layer: null

  # Coefficient units. We use fraction_of_residual_norm (paper convention) so
  # that a coefficient of 0.5 means "add a vector whose magnitude is half the
  # typical residual stream norm at the chosen layer."
  coefficient_units: fraction_of_residual_norm

  # Filled by `python -m steering.norm`. Maps layer index -> mean L2 norm of
  # the residual stream at that layer over a small neutral corpus.
  layer_norms: null

  # Filled by 03_calibrate_coefficients.py. Both vectors are one-sided
  # (non-negative) — happy is added when weather is nice, sad is added when
  # weather is bad. They are not subtracted from the baseline.
  happy:
    max: null  # TBD; expected in [0.25, 1.0]
  sad:
    max: null  # TBD; expected in [0.25, 1.0]

# Open-Meteo location. Override with --lat/--lon on run.py.
location:
  lat: 47.4979   # Budapest by default; change to your actual location
  lon: 19.0402
  timezone: auto

system_prompt: |
  You are a helpful, conversational assistant. Respond naturally and briefly.
